[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-assistant"
version = "0.1.0"
description = "Real-time Urdu <-> English AI meeting translator for Microsoft Teams"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "soxr>=0.3.7",
]

[project.optional-dependencies]
windows = ["PyAudioWPatch>=0.2.12", "psutil>=5.9"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 90
target-version = "py312"
